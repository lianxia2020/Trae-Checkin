name: Trae Daily Checkin
on:
  schedule:
    - cron: "23 16 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: trae-checkin
  cancel-in-progress: true
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Debug list files
        run: |
          pwd
          ls -la
      - name: 恢复 token 缓存
        uses: actions/cache@v5
        with:
          path: .trae_token_cache.json
          key: trae-token-${{ github.run_id }}
          restore-keys: |
            trae-token-
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run checkin
        env:
          TRAE_ACCOUNTS: "${{ secrets.TRAE_ACCOUNTS }}"
          QYWX_TOKEN: "${{ secrets.QYWX_TOKEN }}"
          TRAE_JITTER: "1"
        run: python 03_checkin.py
      - name: Notify on failure
        if: failure()
        run: echo "::warning::签到脚本执行失败，请检查 secrets 和日志"
